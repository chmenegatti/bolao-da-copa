name: palpite-perfeito

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: palpite-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    networks:
      - appnet

  app-blue:
    image: ${APP_IMAGE:-ghcr.io/OWNER/REPO:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-file:/data/palpite.db}
      ADMIN_PASS: ${ADMIN_PASS}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
    volumes:
      - app-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - appnet

  app-green:
    image: ${APP_IMAGE:-ghcr.io/OWNER/REPO:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-file:/data/palpite.db}
      ADMIN_PASS: ${ADMIN_PASS}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
    volumes:
      - app-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  app-data: