name: palpite-perfeito-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        DATABASE_URL: file:./prisma/dev.db
    container_name: palpite-local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/prisma/dev.db
      ADMIN_PASS: ${ADMIN_PASS}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3010}
    volumes:
      - ./prisma:/app/prisma
    command: sh -lc "npx prisma migrate deploy && cd .next/standalone && node server.js"
    ports:
      - "${LOCAL_PORT:-3010}:3000"
    networks:
      - nemesis-starter_nemesis
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  nemesis-starter_nemesis:
    external: true