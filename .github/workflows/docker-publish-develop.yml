name: Docker Publish Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop
            type=raw,value=develop-latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy develop no servidor
    needs: build-and-push
    runs-on: [self-hosted, linux]
    env:
      DEV_DATABASE_URL: file:/data/palpite-dev.db
      DEV_ADMIN_PASS: ${{ secrets.DEV_ADMIN_PASS }}
      DEV_AUTH_SECRET: ${{ secrets.DEV_AUTH_SECRET }}
      DEV_NEXTAUTH_URL: ${{ vars.DEV_NEXTAUTH_URL }}
      DEV_APP_IMAGE: ghcr.io/${{ github.repository }}:develop-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Executar deploy develop
        run: bash ./scripts/deploy-develop.sh