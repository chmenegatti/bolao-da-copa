name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy na máquina local
    needs: build-and-push
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout (obtém compose files atualizados)
        uses: actions/checkout@v5

      - name: Linkar .env permanente
        run: ln -sf /home/cesar-menegatti/js/bolao-da-copa/.env .env

      - name: Pull nova imagem
        run: docker compose -f docker-compose.local.yml pull app

      - name: Rodar migrações
        run: docker compose -f docker-compose.local.yml run --rm --no-deps app sh -c "npx prisma migrate deploy"

      - name: Reiniciar container
        run: docker compose -f docker-compose.local.yml up -d --force-recreate app

      - name: Healthcheck
        run: |
          CONTAINER_ID="$(docker compose -f docker-compose.local.yml ps -q app)"
          for i in $(seq 1 20); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$CONTAINER_ID" 2>/dev/null || echo starting)"
            echo "Tentativa $i: $STATUS"
            [[ "$STATUS" == "healthy" ]] && exit 0
            sleep 5
          done
          echo "Container não ficou saudável após o deploy." >&2
          docker logs --tail 50 "$CONTAINER_ID"
          exit 1