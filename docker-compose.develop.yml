name: palpite-perfeito-develop

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: palpite-dev-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/nginx/develop/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/develop/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - app
    networks:
      - appnet

  app:
    image: ${DEV_APP_IMAGE:-ghcr.io/OWNER/REPO:develop}
    container_name: palpite-dev-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-file:/data/palpite-dev.db}
      ADMIN_PASS: ${ADMIN_PASS}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - app-data:/data
    expose:
      - "3002"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  app-data: