apiVersion: apps/v1
kind: Deployment
metadata:
  name: palpite-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: palpite-app
  template:
    metadata:
      labels:
        app: palpite-app
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV }}

            - name: NEXTAUTH_URL
              value: {{ .Values.env.NEXTAUTH_URL }}

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: palpite-app-secret
                  key: DATABASE_URL

            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: palpite-app-secret
                  key: AUTH_SECRET

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"