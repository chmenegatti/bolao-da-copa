apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: palpite-prod-db
  namespace: palpite-prod
spec:
  instances: 2

  storage:
    size: 1Gi

  bootstrap:
    initdb:
      database: palpite-prod
      owner: palpite
      secret:
        name: pg-auth
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi